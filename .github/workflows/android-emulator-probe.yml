name: Android emulator feasibility

on:
  workflow_dispatch:
  push:
    branches: [fix-aauto]
    paths:
      - ".github/workflows/android-emulator-probe.yml"

permissions:
  contents: read

jobs:
  emulator-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Start a Play Store Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-metrics
            -camera-back none
            -camera-front none
          script: |
            adb wait-for-device
            echo "Android API: $(adb shell getprop ro.build.version.sdk)"
            echo "Google Play package: $(adb shell pm path com.android.vending || echo missing)"
            echo "Android Auto package: $(adb shell pm path com.google.android.projection.gearhead || echo missing)"
            adb forward tcp:5277 tcp:5277
            adb forward --list
